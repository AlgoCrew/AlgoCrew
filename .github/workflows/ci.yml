# Checks every pull request into the release branch (roadmap T1.11).
name: CI
on:
  pull_request:
    branches: [site-v2, main]
  push:
    branches: [site-v2]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:checks
      - run: npm run check:tokens
      - run: npm run build
      # Both checks read the build output, so they run after it.
      - run: npm run check:sitemap
      - run: npm run check:links
